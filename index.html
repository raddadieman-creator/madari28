<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body><title>مداري</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout concept: a dark observatory. The 3D scene is the room; text sits on quiet glass panels beside it
   (side panel on desktop, bottom sheet on phones). Violet and electric blue are reserved for light and action. */
:root{
  color-scheme: dark;
  --bg:#04050d;
  --bg2:#0a0e22;
  --surface:rgba(14,18,42,.78);
  --surface-solid:#0c1029;
  --line:rgba(150,160,255,.16);
  --line-strong:rgba(150,160,255,.34);
  --text:#f6f7ff;
  --muted:#a9aed2;
  --violet:#9b6bff;
  --electric:#3d8bff;
  --cyan:#62d0ff;
  --gold:#ffc65c;
  --ok:#5fe0a8;
  --bad:#ff8fa3;
  --f-ar:"Tajawal",system-ui,Tahoma,"Segoe UI",Arial,sans-serif;
  --f-en:"Inter",system-ui,"Segoe UI",Roboto,Arial,sans-serif;
  --hdr:64px;
}
[hidden]{display:none!important}
html{direction:rtl}
html[dir=ltr]{direction:ltr}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;color:var(--text);font-family:var(--f-ar);font-size:17px;line-height:1.7;font-weight:500;min-height:100vh;-webkit-font-smoothing:antialiased;
  background:radial-gradient(70rem 50rem at 100% -20%,rgba(155,107,255,.14),transparent 60%),radial-gradient(60rem 40rem at -10% 120%,rgba(61,139,255,.10),transparent 60%),var(--bg)}
html[lang=en] body{font-family:var(--f-en),var(--f-ar);font-weight:400;line-height:1.6}
h1,h2,h3,h4{margin:0;font-weight:700;line-height:1.25;text-wrap:balance}
html[lang=en] h1,html[lang=en] h2{letter-spacing:-.02em}
p{margin:0}
a{color:var(--cyan)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--cyan);outline-offset:3px;border-radius:12px}
.num{direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.sky{position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.55;
  background-image:radial-gradient(1.1px 1.1px at 20px 30px,#fff,transparent),radial-gradient(1px 1px at 140px 80px,#dfe6ff,transparent),radial-gradient(1.3px 1.3px at 90px 160px,#fff,transparent),radial-gradient(1px 1px at 210px 210px,#d6d0ff,transparent);
  background-size:260px 250px}
.wrap{position:relative;z-index:1;max-width:1260px;margin:0 auto;padding-inline:16px;padding-block:0 40px}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
[dir=ltr] .flip{transform:scaleX(-1)}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:flex;align-items:center;gap:10px;height:var(--hdr);margin-inline:-16px;padding-inline:16px;
  background:rgba(4,5,13,.84);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.logo{background:#fff;border-radius:12px;padding:4px;display:grid;place-items:center;flex:none}
.logo img{display:block;width:34px;height:auto}
.brand{display:flex;flex-direction:column;line-height:1.15;background:none;border:0;padding:0;cursor:pointer;text-align:start;min-width:0}
.brand b{font-size:20px;font-weight:700}
.brand small{font-size:12px;color:var(--muted);white-space:nowrap}
.spacer{flex:1}
.seg{display:inline-flex;padding:3px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.03);flex:none}
.seg button{border:0;background:none;padding:0 12px;border-radius:999px;cursor:pointer;font-size:14px;min-height:36px;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--text);color:#0a0c1c;font-weight:700}
.seg .ar{font-family:var(--f-ar)} .seg .en{font-family:var(--f-en)}
.ctl{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;min-width:44px;padding:0 14px;border-radius:999px;border:1px solid var(--line);
  background:rgba(255,255,255,.04);cursor:pointer;font-size:15px;font-weight:500;transition:background .2s,border-color .2s;white-space:nowrap}
.ctl:hover{background:rgba(255,255,255,.09);border-color:var(--line-strong)}
.ctl.icon{padding:0;width:44px}
.ctl.home{border-color:rgba(98,208,255,.55);background:rgba(98,208,255,.12);color:#e2f7ff}
.ctl.home[aria-current=page]{background:rgba(98,208,255,.24)}
.ctl[aria-pressed=true]{background:rgba(98,208,255,.16);border-color:rgba(98,208,255,.55);color:#e2f7ff}
@media (max-width:720px){.top .ctl .txt{display:none}.top .ctl{padding:0;width:44px}.brand small{display:none}}
@media (max-width:400px){.brand{display:none}}
@media (max-width:420px){.top{gap:6px}.top .ctl{width:40px;min-width:40px;min-height:40px}.seg button{padding:0 8px;font-size:13px}.brand b{font-size:18px}.logo img{width:30px}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:54px;padding:0 28px;border-radius:999px;border:0;cursor:pointer;font-weight:700;font-size:18px;color:#fff;
  background:linear-gradient(120deg,var(--violet),var(--electric));box-shadow:0 12px 30px -10px rgba(61,139,255,.75),inset 0 1px 0 rgba(255,255,255,.25);transition:transform .15s ease,filter .2s}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:scale(.98)}
.btn.ghost{background:rgba(255,255,255,.06);box-shadow:none;border:1px solid var(--line-strong);font-weight:600;font-size:16px;min-height:48px;padding:0 20px}

/* start */
.start{position:relative;min-height:100vh;min-height:100dvh;display:grid;grid-template-rows:auto 1fr auto;margin-inline:-16px;padding-inline:16px;overflow:hidden}
.hero{position:absolute;inset:0;z-index:0}
.hero .stage-inner{position:absolute;inset:0}
.hero canvas{display:block;width:100%;height:100%;pointer-events:none}
.start::after{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;background:linear-gradient(to left,rgba(4,5,13,.94) 0%,rgba(4,5,13,.6) 38%,rgba(4,5,13,0) 68%)}
[dir=ltr] .start::after{background:linear-gradient(to right,rgba(4,5,13,.94) 0%,rgba(4,5,13,.6) 38%,rgba(4,5,13,0) 68%)}
.start>*:not(.hero){position:relative;z-index:1}
.start-top{display:flex;align-items:center;gap:12px;padding-block:16px;flex-wrap:wrap}
.school{display:flex;align-items:center;gap:12px;min-width:0}
.school .logo{border-radius:14px;padding:5px}
.school .logo img{width:46px}
.school span{font-weight:700;font-size:16px;font-family:var(--f-ar)}
.start-copy{align-self:center;max-width:540px;display:grid;gap:18px;padding-block:24px}
.start-copy h1{font-size:clamp(64px,12vw,124px);line-height:1;font-weight:700;padding-block:.06em;
  background:linear-gradient(120deg,#ffffff 15%,#e2d4ff 45%,#9fd8ff 85%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 6px 34px rgba(155,107,255,.45))}
.eyebrow{display:inline-flex;align-items:center;gap:10px;justify-self:start;padding:6px 14px;border-radius:999px;font-size:14px;font-weight:600;color:#dfe9ff;
  background:rgba(98,208,255,.08);border:1px solid rgba(98,208,255,.35);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.eyebrow i{width:8px;height:8px;border-radius:50%;background:var(--cyan);box-shadow:0 0 0 0 rgba(98,208,255,.7);animation:ping 2.2s ease-out infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(98,208,255,.7)}80%,100%{box-shadow:0 0 0 10px rgba(98,208,255,0)}}
.teaser{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tz{padding:12px 14px;border-radius:18px;background:rgba(12,16,40,.55);border:1px solid var(--line);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:grid;gap:2px;min-width:0}
.tz b{font-family:var(--f-en);font-size:28px;font-weight:700;line-height:1.1;background:linear-gradient(120deg,#fff,#b9a3ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.tz:nth-child(2) b{background:linear-gradient(120deg,#fff,#ffc98a);-webkit-background-clip:text;background-clip:text}
.tz:nth-child(3) b{background:linear-gradient(120deg,#fff,#8fd3ff);-webkit-background-clip:text;background-clip:text}
.tz span{font-size:14px;color:#cfd4f3;line-height:1.35}
.launch{padding:16px;border-radius:24px;background:rgba(10,13,32,.6);border:1px solid var(--line);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 30px 60px -30px rgba(0,0,0,.8)}
.launch .btn{animation:glow 3.2s ease-in-out infinite}
@keyframes glow{0%,100%{box-shadow:0 12px 30px -10px rgba(61,139,255,.7),inset 0 1px 0 rgba(255,255,255,.25)}50%{box-shadow:0 14px 44px -6px rgba(155,107,255,.85),inset 0 1px 0 rgba(255,255,255,.25)}}
.start-copy>*{animation:rise .8s cubic-bezier(.2,.7,.2,1) both}
.start-copy>*:nth-child(2){animation-delay:.08s}.start-copy>*:nth-child(3){animation-delay:.16s}.start-copy>*:nth-child(4){animation-delay:.24s}.start-copy>*:nth-child(5){animation-delay:.32s}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.meteor{position:absolute;z-index:0;top:0;left:0;width:160px;height:2px;border-radius:2px;pointer-events:none;opacity:0;
  background:linear-gradient(90deg,rgba(255,255,255,0),rgba(210,230,255,.95));transform-origin:right center;animation:meteor 14s linear infinite}
.meteor::after{content:"";position:absolute;right:-2px;top:-2px;width:6px;height:6px;border-radius:50%;background:#fff;box-shadow:0 0 12px 3px rgba(160,200,255,.9)}
.meteor.m2{animation-delay:5.5s;animation-duration:17s}.meteor.m3{animation-delay:10s;animation-duration:21s}
@keyframes meteor{0%{opacity:0;transform:translate(var(--x0),var(--y0)) rotate(28deg)}1%{opacity:1}7%{opacity:0;transform:translate(calc(var(--x0) + 420px),calc(var(--y0) + 224px)) rotate(28deg)}100%{opacity:0;transform:translate(calc(var(--x0) + 420px),calc(var(--y0) + 224px)) rotate(28deg)}}
.calm .meteor{display:none}
@media (prefers-reduced-motion:reduce){.meteor{display:none}.start-copy>*,.eyebrow i,.launch .btn{animation:none}}
@media (max-width:520px){.tz b{font-size:24px}.tz span{font-size:13px}.tz{padding:10px 12px}}
html[lang=en] .start-copy h1{letter-spacing:-.04em}
.tagline{font-size:clamp(19px,2.5vw,24px);color:#e3e6ff;line-height:1.6}
.field{display:grid;gap:8px}
.field label{font-size:15px;color:var(--muted)}
.field input{min-height:58px;border-radius:18px;border:1px solid var(--line-strong);background:rgba(8,10,26,.8);color:var(--text);font:inherit;font-size:19px;padding:0 18px;width:100%}
.field input:focus{outline:none;border-color:var(--cyan);box-shadow:0 0 0 4px rgba(98,208,255,.15)}
.err{color:var(--bad);font-size:15px}
.note{font-size:14px;color:var(--muted)}
.credits{font-size:14px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 20px}
.start-foot{display:grid;gap:18px;padding-block:8px 24px;max-width:640px}
.visitors{display:inline-flex;align-items:center;gap:8px;justify-self:start;padding:6px 14px;border-radius:999px;font-size:14px;color:#dfe9ff;background:rgba(98,208,255,.08);border:1px solid rgba(98,208,255,.32);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.visitors b{font-family:var(--f-en);font-size:16px;font-weight:700}
.team{display:grid;gap:8px}
.trow{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.trow .k{font-size:14px;color:#c9cdee;font-weight:600}
.trow .v{display:flex;flex-wrap:wrap;gap:8px}
.trow .nm{font-family:var(--f-ar);padding:5px 15px;border-radius:999px;font-size:16px;font-weight:700;color:#fff;line-height:1.5;
  background:linear-gradient(135deg,rgba(155,107,255,.22),rgba(61,139,255,.16));border:1px solid rgba(170,180,255,.35);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
[dir=ltr] .trow .v{justify-content:flex-start}
.foot .ids{gap:8px}
.foot .ids .trow .v{font-size:16px}
.school .logo img{width:78px}
.wsw{display:flex;align-items:center;gap:10px;padding-inline-start:14px;border-inline-start:1px solid var(--line-strong);min-width:0}
.wsw .ri{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none;color:#d6ecff;background:linear-gradient(135deg,rgba(155,107,255,.32),rgba(61,139,255,.32));border:1px solid rgba(150,170,255,.35)}
.wsw .ri svg{width:20px;height:20px}
.wsw b{display:block;font-size:14px;font-weight:700;line-height:1.3;white-space:nowrap}
.wsw small{display:block;font-size:12.5px;color:var(--muted);line-height:1.35}
.top .wsw{margin-inline-start:6px}
@media (max-width:1100px){.top .wsw{display:none}}
@media (max-width:720px){.start-top .wsw{order:5;flex:0 1 auto;border:1px solid var(--line);padding:8px 14px 8px 10px;border-radius:16px;background:rgba(4,5,13,.72);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}.start-top .spacer{flex-basis:100%;height:0}}
.quote{margin:0;display:grid;gap:4px;cursor:pointer;transition:opacity .45s ease;max-width:560px}
.quote.out{opacity:0}
.quote::before{content:"";width:40px;height:2px;border-radius:2px;background:linear-gradient(90deg,var(--violet),var(--cyan));margin-bottom:6px}
.quote blockquote{margin:0;font-family:var(--f-en);font-size:clamp(18px,2.1vw,22px);font-weight:500;font-style:italic;letter-spacing:-.01em;color:#e4ecff;line-height:1.45;direction:ltr;text-align:left}
[dir=rtl] .quote blockquote{text-align:right}
.quote figcaption{font-size:15px;color:var(--muted)}
.hub .quote{max-width:720px}
.credits bdi{color:#e9ebff;font-family:var(--f-ar);font-weight:500}
@media (max-width:820px){
  .start::after,[dir=ltr] .start::after{background:linear-gradient(to top,rgba(4,5,13,.97) 35%,rgba(4,5,13,.55) 62%,rgba(4,5,13,0) 82%)}
  .start-copy{align-self:end;padding-top:24vh;gap:14px}
}

/* hub */
.hub{display:grid;gap:28px;padding-block:30px 10px}
.hub h1{font-size:clamp(28px,4.6vw,44px);max-width:22ch}
.hub h1 .nm{color:#cdb8ff}
.dests{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media (max-width:900px){.dests{grid-template-columns:1fr}}
.dcard{position:relative;display:flex;flex-direction:column;justify-content:flex-end;gap:6px;min-height:360px;border-radius:28px;overflow:hidden;border:1px solid var(--line);
  background-color:#070917;background-size:cover;background-position:center;cursor:pointer;text-align:start;padding:22px;isolation:isolate;transition:transform .25s ease,border-color .25s}
.dcard::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(to top,rgba(4,5,13,.96) 12%,rgba(4,5,13,.4) 52%,rgba(4,5,13,0) 78%)}
.dcard:hover{transform:translateY(-3px);border-color:var(--line-strong)}
.dcard .t{font-size:30px;font-weight:700;line-height:1.2}
.dcard .d{color:#d2d6f3;font-size:16px}
.pill{display:inline-grid;place-items:center;width:46px;height:46px;margin-top:10px;align-self:flex-start;padding:0;border-radius:999px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);font-weight:700;font-size:15px}
@media (max-width:900px){.dcard{min-height:250px}}
.dcard.fallback-planets{background-image:radial-gradient(circle at 70% 35%,#7fb2ff 0,#2a5fc0 14%,transparent 15%),radial-gradient(circle at 30% 60%,#3a2a6a,#05060f 60%)}
.dcard.fallback-stars{background-image:radial-gradient(circle at 30% 40%,#ffe9a8 0,#ffb54d 8%,transparent 20%),radial-gradient(circle at 70% 30%,#a9c4ff 0,transparent 10%),#05060f}
.dcard.fallback-galaxies{background-image:radial-gradient(ellipse at 50% 40%,#fff2d0 0,#b9a8ff 12%,transparent 40%),#05060f}
.minis{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:720px){.minis{grid-template-columns:1fr}}
.mini{display:flex;align-items:center;gap:16px;min-height:112px;padding:14px 18px;border-radius:24px;border:1px solid var(--line);background:linear-gradient(140deg,rgba(155,107,255,.10),rgba(61,139,255,.06));cursor:pointer;text-align:start}
.mini:hover{border-color:var(--line-strong)}
.mini .thumb{width:84px;height:84px;border-radius:18px;background:#0a0d22 center/cover no-repeat;flex:none;border:1px solid var(--line)}
.mini .t{display:block;font-weight:700;font-size:20px}
.mini .d{display:block;color:var(--muted);font-size:15px}
.mini .go{margin-inline-start:auto;color:var(--cyan)}
.pass-thumb{display:grid;place-items:center;background:linear-gradient(150deg,#1b1450,#0b1a44)!important}
.pass-thumb i{width:46px;height:58px;border-radius:8px;border:2px solid rgba(205,184,255,.7);position:relative}
.pass-thumb i::after{content:"";position:absolute;left:50%;top:12px;width:18px;height:18px;margin-left:-9px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#62d0ff 40%,#3d3d9a)}
.prog{border:1px solid var(--line);border-radius:24px;padding:18px 20px;background:var(--surface);display:grid;gap:14px}
.prog-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.prog-head h3{font-size:20px}
.prog-head .count{color:var(--muted);font-size:15px}
.bar{height:8px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden}
.bar i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--violet),var(--electric));transition:width .5s ease}
[dir=rtl] .bar i{background:linear-gradient(270deg,var(--violet),var(--electric));margin-inline-start:0}
.missions{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:8px}
.missions li{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;padding:10px 12px;border-radius:14px;background:rgba(255,255,255,.03)}
.missions .chk{width:24px;height:24px;border-radius:50%;border:2px solid var(--line-strong);display:grid;place-items:center;margin-top:2px}
.missions .chk svg{width:14px;height:14px}
.missions li.done .chk{background:var(--ok);border-color:var(--ok);color:#06281a}
.missions b{display:block;font-weight:500;font-size:16px;line-height:1.45}
.missions small{color:var(--muted);font-size:13px}
.badges{display:flex;flex-wrap:wrap;gap:6px}
.badge{display:inline-flex;align-items:center;gap:6px;padding:3px 11px;border-radius:999px;font-size:13px;border:1px solid var(--line);color:var(--muted)}
.badge i{width:10px;height:10px;border-radius:50%;background:#2c3159}
.badge.on{color:var(--text);border-color:rgba(255,255,255,.22)}
.badge.on i{background:var(--c);box-shadow:0 0 8px var(--c)}
.foot{display:flex;flex-wrap:wrap;align-items:center;gap:14px 24px;justify-content:space-between;padding-top:6px;border-top:1px solid var(--line);padding-block:18px 0}
.foot .ids{display:grid;gap:8px;font-size:14px;color:var(--muted)}
.foot .ids .sch{color:var(--text);font-weight:700;font-family:var(--f-ar)}
.foot bdi{color:#e9ebff;font-family:var(--f-ar)}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 14px;border-radius:16px;border:1px solid rgba(255,143,163,.4);background:rgba(255,143,163,.07)}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;text-underline-offset:4px;cursor:pointer;font-size:14px;padding:8px 0;min-height:44px}

/* explore */
.explore{display:grid;gap:14px;padding-block:14px 10px}
.ex-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.ex-head h2{font-size:clamp(24px,3.6vw,34px)}
.strip{display:flex;gap:8px;overflow-x:auto;padding-block:2px 8px;scrollbar-width:thin;margin-inline:-16px;padding-inline:16px}
.chip{flex:none;display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.04);cursor:pointer;font-size:15px;font-weight:500}
.chip i{width:12px;height:12px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c)}
.chip[aria-pressed=true]{border-color:var(--cyan);background:rgba(98,208,255,.14)}
.chip .seen{color:var(--ok);display:inline-grid}
.chip .seen svg{width:14px;height:14px}

    box-shadow:0 -24px 60px rgba(0,0,0,.65);border-bottom:0;animation:sheetUp .28s ease both}

}

.acts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start;margin-top:8px}

.card{border:1px solid var(--line);border-radius:26px;padding:20px;background:var(--surface);display:grid;gap:14px;min-width:0}

.pop-wrap{position:fixed;inset:0;z-index:70;display:flex;justify-content:flex-end;align-items:flex-start;padding:calc(var(--hdr) + 8px) 16px 16px;background:rgba(2,3,10,.4)}

  ok:'speechSynthesis' in window&&'SpeechSynthesisUtterance' in window, voices:[], loaded:false, audio:null, btn:null, run:null,

  /* prefer natural/neural/enhanced voices: they sound much closer to a human narrator */
  rank(v,l){ const n=v.name||''; let s=0;

function landRings(){ if(LAND) return LAND; LAND=LAND_ENC.split(';').map(r=>{ const a=r.split(',').map(Number), out=[]; let x=0,y=0; for(let i=0;i<a.length;i+=2){ x+=a[i]; y+=a[i+1]; out.push([x/5,y/5]); } return out; }); return LAND; }
function drawWorld(x,w,h,opt={}){
  const g=x.createLinearGradient(0,0,0,h); g.addColorStop(0,opt.ocean0||'#0c2452'); g.addColorStop(.5,opt.ocean1||'#14407f'); g.addColorStop(1,opt.ocean0||'#0c2452'); x.fillStyle=g; x.fillRect(0,0,w,h);
  const X=lon=>(lon+180)/360*w, Y=lat=>(90-lat)/180*h;
  x.strokeStyle='rgba(150,190,255,.13)'; x.lineWidth=Math.max(1,w/1600);
  for(let lon=-150;lon<180;lon+=30){ x.beginPath(); x.moveTo(X(lon),0); x.lineTo(X(lon),h); x.stroke(); }
  for(let lat=-60;lat<=60;lat+=30){ x.beginPath(); x.moveTo(0,Y(lat)); x.lineTo(w,Y(lat)); x.stroke(); }
  x.fillStyle=opt.land||'#2e7461'; x.strokeStyle=opt.coast||'rgba(150,235,200,.55)'; x.lineWidth=Math.max(1,w/1400);
  for(const sh of [-360,0,360]){ x.beginPath(); landRings().forEach(r=>{ r.forEach(([lo,la],i)=>{ const px=X(lo+sh),py=Y(la); if(i) x.lineTo(px,py); else x.moveTo(px,py); }); x.closePath(); }); x.fill('evenodd'); x.stroke(); }
  x.fillStyle='rgba(255,198,92,.38)'; x.strokeStyle='#ffc65c'; x.lineWidth=Math.max(1.5,w/900); x.beginPath(); SAUDI.forEach(([lo,la],i)=>i?x.lineTo(X(lo),Y(la)):x.moveTo(X(lo),Y(la))); x.closePath(); x.fill(); x.stroke();
}
function gcKm(a,b){ const R=6371, d2r=Math.PI/180, dl=(b[0]-a[0])*d2r, dn=(b[1]-a[1])*d2r; const s=Math.sin(dl/2)**2+Math.cos(a[0]*d2r)*Math.cos(b[0]*d2r)*Math.sin(dn/2)**2; return 2*R*Math.asin(Math.min(1,Math.sqrt(s))); }

  card.forEach(([az,n])=>{ const [x,y]=P(-11,az); const tx=mk('text',{x,y:y+5,'text-anchor':'middle',class:'card-lbl'}); tx.textContent=L(n); });

    SKY_STARS.lines.forEach(([a,b])=>{ const A=pos[a],Bq=pos[b]; if(!A||!Bq||A.alt<0||Bq.alt<0) return; const [x1,y1]=P(A.alt,A.az),[x2,y2]=P(Bq.alt,Bq.az); mk('line',{x1,y1,x2,y2,stroke:'rgba(140,190,255,'+(.35*starOp)+')','stroke-width':'1'}); });
    SKY_STARS.stars.forEach(([n,ra,dec,mag])=>{ const h=pos[n]; if(h.alt<0) return; const [x,y]=P(h.alt,h.az); const r=Math.max(.8,3.4-mag*.95);

      if(mag<0.9||n==='Polaris'){ const tx=mk('text',{x:x+(r+3),y:y+4,class:'star-lbl','fill-opacity':String(starOp)}); tx.textContent=lang==='ar'?(STAR_AR[n]||n):n; } }); }
  // sun & moon & planets
  const bodies=[];
  if(sa>-1){ const [x,y]=P(sa,sun.az); mk('circle',{cx:x,cy:y,r:14,fill:'#ffd54d',opacity:'.25'}); mk('circle',{cx:x,cy:y,r:9,fill:'#ffe27a'}); const tx=mk('text',{x,y:y-15,'text-anchor':'middle',class:'pl-lbl'}); tx.textContent=t('whereSun'); bodies.push({id:'sun',alt:sa,az:sun.az}); }
  SKY_BODIES.forEach(b=>{ const p=Astro.body(b.id,d,pl.lat,pl.lon); bodies.push({id:b.id,alt:p.alt,az:p.az}); if(p.alt<-0.5) return; const [x,y]=P(Math.max(0,p.alt),p.az); const g=mk('g',{class:'pl'+(sky.sel===b.id?' sel':''),transform:`translate(${x},${y})`,tabindex:'0',role:'button','aria-label':L(b.name)});
    if(b.id==='moon'){ const ph=Astro.moonPhase(d); mk('circle',{r:10,fill:'#2a2c3f',stroke:'rgba(255,255,255,.3)'},g); mk('path',{d:moonPath(10,ph.frac,ph.waxing),fill:'#f1ecdc'},g); }
    else { mk('circle',{r:9,fill:b.c,opacity:'.22'},g); mk('circle',{r:4.6,fill:b.c},g); }
    if(sky.sel===b.id) mk('circle',{r:16,fill:'none',stroke:'#62d0ff','stroke-width':'2'},g);

    const pick=()=>{ sky.sel=b.id; if(b.id!=='moon') complete('skyplanet'); renderSky(false); };
    g.addEventListener('click',pick); g.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); pick(); } }); });

  const s=bodies.find(b=>b.id===sky.sel)||null; detail.replaceChildren();
  if(s){ const sb=SKY_BODIES.find(b=>b.id===s.id); const nm=sb?L(sb.name):t('whereSun');
    detail.append(el('b',{text:nm}), el('span',{text:s.alt>0?`${t('altLabel')}: ${Math.round(s.alt)}° · ${t('dirLabel')}: ${dirName(s.az)}`:t('belowH')})); }
  return svg;
}

function stopLive(){ clearInterval(live.timer); live.timer=null; }
async function pollISS(){
  if(window.claude){ live.fail=true; paintISS(); return; }
  try{ const r=await fetch('https://api.wheretheiss.at/v1/satellites/25544',{cache:'no-store'}); if(!r.ok) throw 0; const j=await r.json(); if(typeof j.latitude!=='number') throw 0;
    live.last=j; live.fail=false; live.past.push([j.latitude,j.longitude]); if(live.past.length>2000) live.past.shift();
    if(!live.pred||Date.now()-live.predAt>9*60000){ live.predAt=Date.now(); const ts=Array.from({length:10},(_,i)=>Math.round(j.timestamp+i*600)).join(',');
      fetch('https://api.wheretheiss.at/v1/satellites/25544/positions?timestamps='+ts+'&units=kilometers').then(r=>r.ok?r.json():null).then(a=>{ if(Array.isArray(a)) { live.pred=a.map(p=>[p.latitude,p.longitude]); paintISS(); } }).catch(()=>{}); }
  }catch(e){ if(!live.last) live.fail=true; }
  if(current==='live') paintISS();
}
function terminatorPoly(d){ // night side polygon (lat,lon) from the subsolar point
  const s=Astro.body('sun',d,0,0); const gm=Astro.gmst(d); let sLon=((s.ra-gm+540)%360)-180; const dec=s.dec*Math.PI/180;
  const pts=[]; for(let lon=-180;lon<=180;lon+=2){ const H=(lon-sLon)*Math.PI/180; const lat=Math.atan(-Math.cos(H)/Math.tan(dec||1e-6))*180/Math.PI; pts.push([lat,lon]); } return {pts,dark:dec>0?-90:90}; }
function paintISS(){
  const cv=live.cv; if(!cv||!cv.isConnected) return; const x=cv.getContext('2d'), w=cv.width, h=cv.height; drawWorld(x,w,h);
  const X=lon=>(lon+180)/360*w, Y=lat=>(90-lat)/180*h;
  const tp=terminatorPoly(new Date()); x.fillStyle='rgba(2,4,18,.58)'; x.beginPath(); x.moveTo(X(-180),Y(tp.dark)); tp.pts.forEach(([la,lo])=>x.lineTo(X(lo),Y(la))); x.lineTo(X(180),Y(tp.dark)); x.closePath(); x.fill();
  const path=(pts,style,dash,wid)=>{ if(!pts||pts.length<2) return; x.strokeStyle=style; x.lineWidth=wid; x.setLineDash(dash||[]); x.beginPath(); pts.forEach(([la,lo],i)=>{ const px=X(lo),py=Y(la); if(i&&Math.abs(lo-pts[i-1][1])<180) x.lineTo(px,py); else x.moveTo(px,py); }); x.stroke(); x.setLineDash([]); };
  path(live.pred,'rgba(255,255,255,.75)',[10,10],3); path(live.past,'#62d0ff',null,4);
  const [hy,hx]=[Y(MADINAH[0]),X(MADINAH[1])]; x.fillStyle='#ffc65c'; x.beginPath(); x.arc(hx,hy,8,0,7); x.fill(); x.strokeStyle='#04050d'; x.lineWidth=3; x.stroke();
  const st=$('#iss-stats'), msg=$('#iss-msg');

    const g=x.createRadialGradient(px,py,0,px,py,40); g.addColorStop(0,'rgba(98,208,255,.7)'); g.addColorStop(1,'rgba(98,208,255,0)'); x.fillStyle=g; x.beginPath(); x.arc(px,py,40,0,7); x.fill();
    x.save(); x.translate(px,py); x.fillStyle='#fff'; x.fillRect(-5,-5,10,10); x.fillStyle='#8fb4ff'; x.fillRect(-26,-3,16,6); x.fillRect(10,-3,16,6); x.fillStyle='#fff'; x.fillRect(-2,-14,4,28); x.restore();
    if(st) st.replaceChildren(...[[t('lat'),fmtN(j.latitude,2)+'°'],[t('lon'),fmtN(j.longitude,2)+'°'],[t('altKm'),fmtN(j.altitude)+' '+(lang==='ar'?'كم':'km')],[t('speed'),fmtN(j.velocity)+' '+(lang==='ar'?'كم/س':'km/h')],
      [t('fromCity'),fmtN(gcKm(MADINAH,[j.latitude,j.longitude]))+' '+(lang==='ar'?'كم':'km')],[lang==='ar'?'الإضاءة':'Lighting',j.visibility==='eclipsed'?t('shadow'):t('sunlit')]].map(([k,v])=>el('div',{class:'stat txt'},[el('b',{text:v}),el('small',{text:k})])));
    if(msg) msg.replaceChildren(); }
  else if(st){ st.replaceChildren(); if(msg) msg.replaceChildren(el('p',{class:'note',text:live.fail?t('issFail'):t('issLoading')})); }
}
async function loadApod(){
  let c=null; try{ c=JSON.parse(localStorage.getItem('madari-apod')||'null'); }catch(e){}
  if(c&&c.data&&Date.now()-c.at<6*3600000){ live.apod=c.data; paintApod(); return; }
  if(window.claude){ live.apodFail=true; paintApod(); return; }
  try{ const r=await fetch('https://api.nasa.gov/planetary/apod?api_key=DEMO_KEY&thumbs=true'); if(!r.ok) throw 0; const j=await r.json(); if(!j||!j.title) throw 0; live.apod=j; live.apodFail=false;
    try{ localStorage.setItem('madari-apod',JSON.stringify({at:Date.now(),data:j})); }catch(e){} }
  catch(e){ if(c&&c.data) live.apod=c.data; else live.apodFail=true; }
  paintApod();
}
function paintApod(){
  const body=$('#apod-body'); if(!body) return; const a=live.apod;
  if(!a){ body.replaceChildren(el('p',{class:'note',text:live.apodFail?t('apodFail'):'…'}), live.apodFail?extLink('https://apod.nasa.gov/apod/astropix.html','apod.nasa.gov'):null); return; }

  body.replaceChildren( img?el('a',{href:isImg?(a.hdurl||a.url):a.url,target:'_blank',rel:'noopener',class:'apod-img'},[el('img',{src:img,alt:a.title,loading:'lazy'})]):null,
    el('h4',{lang:'en',dir:'ltr',text:a.title}), el('p',{class:'note',dir:'ltr',text:(a.date||'')+(a.copyright?' · © '+a.copyright.replace(/\s+/g,' ').trim():'')}),
    lang==='ar'?el('p',{class:'note',text:t('apodEn')}):null, exp,
    el('div',{class:'row links'},[extLink(isImg?(a.hdurl||a.url):a.url,isImg?t('apodOpen'):t('apodVideo')),extLink('https://apod.nasa.gov/apod/astropix.html','APOD')]) );
}

const SCALE=[ ['mercury',.378,.241],['venus',.907,.615],['earth',1,1],['moon',.166,null],['mars',.377,1.88],['jupiter',2.36,11.9],['saturn',.916,29.4],['uranus',.889,83.7],['neptune',1.12,163.7] ];
const scaleIn={m:'',a:''};
function renderScale(){
  const sec=$('#scr-scale');
  const headB=el('div',{class:'ex-head'},[ el('button',{class:'ctl',type:'button','data-go':'hub'},[icon('back'),el('span',{text:t('back')})]), el('h2',{text:t('scaleTitle')}) ]); headB.firstChild.firstChild.classList.add('flip');
  const m=el('input',{type:'number',inputmode:'decimal',min:'1',max:'300',step:'0.1',id:'sc-m',value:scaleIn.m}); const a=el('input',{type:'number',inputmode:'numeric',min:'1',max:'120',step:'1',id:'sc-a',value:scaleIn.a});
  const err=el('p',{class:'err',hidden:''}); const out=el('div',{class:'scale-out'});
  const run=()=>{ const mv=parseFloat(m.value), av=parseFloat(a.value); scaleIn.m=m.value; scaleIn.a=a.value;
    if(!(mv>=1&&mv<=300)||!(av>=1&&av<=120)){ err.textContent=t('scaleErr'); err.hidden=false; out.replaceChildren(); return; } err.hidden=true; complete('scale');
    out.replaceChildren(el('div',{class:'sc-head'},[el('span'),el('span',{text:t('scaleRead')}),el('span',{text:t('ageThere')})]),
      ...SCALE.map(([id,g,p])=>{ const b=id==='moon'?{name:B('القمر','The Moon'),color:'#cfcac0'}:BODIES[id]; const max=2.36*mv; const w=Math.max(3,(g*mv)/max*100);
        return el('div',{class:'sc-row'+(id==='earth'?' earth':'')},[ el('span',{class:'nm'},[el('i',{style:'--c:'+b.color}),L(b.name),el('small',{text:'×'+g})]),
          el('span',{class:'val'},[el('b',{text:fmtN(g*mv,1)+' '+t('kg')}),el('span',{class:'bar'},[el('i',{style:`width:${w}%;background:${b.color}`})])]),
          el('span',{class:'age'},[el('small',{class:'k',text:t('ageThere')+': '}),p?el('b',{text:fmtN(av/p,av/p>=10?1:2)+' '+t('yrs')}):el('small',{text:t('moonAge')})]) ]); }),
      el('p',{class:'note',text:t('gasNote')}) ); };
  const form=el('form',{class:'scale-form',novalidate:''},[ el('label',{},[el('span',{text:t('massIn')}),m]), el('label',{},[el('span',{text:t('ageIn')}),a]), el('button',{class:'btn',type:'submit',text:t('calc')}) ]);
  form.addEventListener('submit',e=>{ e.preventDefault(); run(); });
  const card=el('article',{class:'card wide'},[el('p',{class:'lead',text:t('scaleIntro')}),form,err,el('p',{class:'note',text:t('noSave')}),out,srcLine('https://nssdc.gsfc.nasa.gov/planetary/factsheet/planet_table_ratio.html','NASA — Planetary Fact Sheet (ratio to Earth)')]);
  sec.replaceChildren(headB,card);
  if(scaleIn.m&&scaleIn.a) run();
}
